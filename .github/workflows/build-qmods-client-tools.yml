name: Build QModsClientTools

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/QModsClientTools
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle/ForgeGradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forgegradle-${{ hashFiles('mods/QModsClientTools/build.gradle') }}

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: mods/QModsClientTools/${{ steps.jar.outputs.path }}

      - name: Commit compiled jar back to the branch
        run: |
          mkdir -p dist
          cp "${{ steps.jar.outputs.path }}" "dist/${{ steps.jar.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "dist/${{ steps.jar.outputs.name }}"
          git commit -m "Add compiled ${{ steps.jar.outputs.name }} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
