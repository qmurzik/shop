name: MAX WebView Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "webview-app/**"
      - ".github/workflows/webview-app-android.yml"
  pull_request:
    paths:
      - "webview-app/**"
      - ".github/workflows/webview-app-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-webview-debug-apk
          path: webview-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
