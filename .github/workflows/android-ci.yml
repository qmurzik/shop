name: Android CI (forPDA)

on:
  push:
    branches:
      - claude/android-4pda-forum-client-f1kcsx
    paths:
      - "android-4pda-client/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android-4pda-client/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: android-4pda-client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship an Android SDK; the third-party
      # android-actions/setup-android action tries to install the long-removed
      # legacy "tools" package and fails, so just accept licenses and make sure
      # the platform/build-tools this project targets are present.
      - name: Accept Android SDK licenses & install platform
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forpda-debug-apk
          path: android-4pda-client/app/build/outputs/apk/debug/*.apk
